      .loading-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;

        background: radial-gradient(
          ellipse at center,
          #1f2528 0%,
          #181c1f 100%

        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: #d3c6aa;
        overflow: hidden;
      }

      /* Animated circuit background */
      .circuit-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.1;
        background-image:
          linear-gradient(90deg, #7a8478 1px, transparent 1px),
          linear-gradient(0deg, #7a8478 1px, transparent 1px);
        background-size: 15px 15px;
        animation: circuit-move 20s linear infinite;
      }

      @keyframes circuit-move {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 15px 15px;
        }
      }

      /* Main content wrapper */
      .loading-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 48px;
      }

      /* Logo and Title */
      .loading-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: fade-in 0.6s ease-out;
      }

      .loading-title {
        font-size: 32px;
        font-weight: 600;
        color: #d3c6aa;
        text-align: center;
        letter-spacing: -0.5px;
        animation: fade-in 0.6s ease-out 0.2s both;
      }

      .loading-subtitle {
        font-size: 14px;
        color: #7a8478;
        text-align: center;
        animation: fade-in 0.6s ease-out 0.4s both;
      }

      /* Loading Animation */
      .loading-animation {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        animation: fade-in 0.6s ease-out 0.6s both;
      }

      /* Progress bar */
      .loading-progress-container {
        width: 320px;
        height: 6px;
        background-color: #272e33;
        border-radius: 3px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
      }

      .loading-progress-bar {
        height: 100%;
        background: linear-gradient(
          90deg,
          #7a8478 0%,
          #83c092 50%,
          #7a8478 100%
        );
        background-size: 200% 100%;
        border-radius: 3px;
        animation: loading-progress 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 0 10px rgba(131, 192, 146, 0.5);
      }

      @keyframes loading-progress {
        0% {
          transform: translateX(-100%);
          background-position: 0% 0;
        }
        50% {
          background-position: 100% 0;
        }
        100% {
          transform: translateX(200%);
          background-position: 200% 0;
        }
      }

      .loading-text {
        font-size: 13px;
        color: #7a8478;
        margin-top: 12px;
        animation: loading-dots 1.5s ease-in-out infinite;
      }

      @keyframes loading-dots {
        0%,
        20% {
          content: 'Loading';
        }
        40% {
          content: 'Loading.';
        }
        60% {
          content: 'Loading..';
        }
        80%,
        100% {
          content: 'Loading...';
        }
      }

      /* Fade in animation */
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Fade out when Flutter is ready */
      .flutter-ready .loading-container {
        opacity: 0;
        transition: opacity 0.6s ease-out;
        pointer-events: none;
      }

      #flutter-container {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;

          font-size: 24px;
        }
        .loading-progress-container {
          width: 260px;
        }
